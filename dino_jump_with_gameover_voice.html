<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Dino Jump</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;font-family:Arial,sans-serif;touch-action:none}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#87ceeb,#f7f7f7)}
#game.night{background:linear-gradient(#182848,#34495e)}
#sun{position:absolute;width:55px;height:55px;border-radius:50%;background:#ffd54f;top:45px;right:12%}
#game.night #sun{background:#eee;box-shadow:0 0 15px white}
.cloud{position:absolute;width:100px;height:30px;background:white;border-radius:30px;opacity:.8}
.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%}
.cloud:before{width:45px;height:45px;left:15px;top:-20px}
.cloud:after{width:55px;height:55px;right:10px;top:-28px}
#cloud1{top:100px;left:80%}#cloud2{top:170px;left:35%;transform:scale(.7)}
#score{position:absolute;top:20px;right:25px;font-size:24px;font-weight:bold;color:#555;z-index:50}
#game.night #score{color:white}
#ground{position:absolute;bottom:80px;left:0;width:100%;height:5px;background:#555;z-index:3}
#dino{position:absolute;left:12%;bottom:85px;width:60px;height:70px;z-index:10}
.dino-body{position:absolute;left:5px;bottom:12px;width:45px;height:45px;background:#555;border-radius:10px 18px 5px 5px}
.dino-head{position:absolute;left:18px;top:0;width:40px;height:38px;background:#555;border-radius:9px 14px 4px 4px}
.dino-eye{position:absolute;right:7px;top:8px;width:6px;height:6px;background:white;border-radius:50%}
.dino-tail{position:absolute;left:-15px;bottom:25px;width:25px;height:13px;background:#555;transform:rotate(-25deg);border-radius:8px}
.leg{position:absolute;bottom:0;width:10px;height:20px;background:#555;border-radius:3px}
.leg1{left:10px}.leg2{left:34px}
#dino.jumping{transform:rotate(-5deg)}
.cactus{position:absolute;bottom:85px;width:30px;background:#32833a;border-radius:5px;z-index:8}
.cactus:before,.cactus:after{content:"";position:absolute;width:11px;height:25px;background:#32833a;border-radius:6px}
.cactus:before{left:-9px;top:20px}.cactus:after{right:-9px;top:10px}
.rock{position:absolute;bottom:85px;width:45px;height:25px;background:#777;border-radius:50% 50% 20% 20%;z-index:8}
#jumpButton{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 35px;border:none;border-radius:15px;background:#555;color:white;font-size:20px;font-weight:bold;z-index:60;box-shadow:0 4px 0 #333}
#jumpButton:active{transform:translateX(-50%) translateY(4px);box-shadow:0 1px 0 #333}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(255,255,255,.88);z-index:100}
#gameOver{display:none}
#game.night .screen{background:rgba(20,30,50,.9)}
h1{font-size:45px;color:#444;margin-bottom:15px}
#game.night h1{color:white}
p{color:#666;font-size:18px;margin:8px;text-align:center}
#game.night p{color:#ddd}
button.mainButton{margin-top:15px;padding:14px 30px;border:none;border-radius:12px;background:#555;color:white;font-size:20px;font-weight:bold}
#flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:90}
</style>
</head>
<body>
<div id="game">
<div id="sun"></div><div id="cloud1" class="cloud"></div><div id="cloud2" class="cloud"></div>
<div id="score">Score: 0</div><div id="ground"></div>
<div id="dino"><div class="dino-head"><div class="dino-eye"></div></div><div class="dino-body"></div><div class="dino-tail"></div><div class="leg leg1"></div><div class="leg leg2"></div></div>
<button id="jumpButton">🦖 JUMP</button><div id="flash"></div>
<div id="startScreen" class="screen"><h1>🦖 Dino Jump</h1><p>Tap JUMP or press SPACE</p><button id="startButton" class="mainButton">START GAME</button></div>
<div id="gameOver" class="screen"><h1>Game Over!</h1><p id="finalScore">Score: 0</p><p id="highScoreText">Best: 0</p><button id="restartButton" class="mainButton">PLAY AGAIN</button></div>
</div>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB8AAAAEAAAAF2RhdGEAAAABAAAAADQwMDAwMDAAAAAgAAAABQAAABhkYXRhAAAAAQAAAAAzMDAwMDAwMAAAABkAAAAGAAAAEWRhdGEAAAABAAAAADEAAAAjAAAABwAAABtkYXRhAAAAAQAAAABieXRldmVod2F2Yw==");
gameOverVoice.preload = "auto";
gameOverVoice.volume = 1;

jumpVoice.preload = "auto";

const game=document.getElementById("game"),dino=document.getElementById("dino"),scoreText=document.getElementById("score");
const jumpButton=document.getElementById("jumpButton"),startScreen=document.getElementById("startScreen"),gameOver=document.getElementById("gameOver");
const startButton=document.getElementById("startButton"),restartButton=document.getElementById("restartButton"),finalScore=document.getElementById("finalScore"),highScoreText=document.getElementById("highScoreText"),flash=document.getElementById("flash");

const GROUND=85,GRAVITY=.75,JUMP_POWER=14;
let dinoBottom=GROUND,velocity=0,jumping=false,running=false,score=0;
let highScore=Number(localStorage.getItem("dinoHighScore"))||0;
let obstacles=[],lastTime=0,obstacleTimer=0,nextObstacle=1400,nightTimer=0,animationId=null;

function unlockVoice(){
  jumpVoice.volume=1;
  jumpVoice.play().then(()=>{jumpVoice.pause();jumpVoice.currentTime=0}).catch(()=>{});
}
function playVoice(){
  jumpVoice.pause(); jumpVoice.currentTime=0;
  jumpVoice.play().catch(()=>{});
}
function startGame(){
  obstacles.forEach(o=>o.element.remove()); obstacles=[];
  score=0; velocity=0; dinoBottom=GROUND;jumping=false;obstacleTimer=0;nextObstacle=1400;nightTimer=0;lastTime=0;
  scoreText.textContent="Score: 0";dino.style.bottom=GROUND+"px";dino.classList.remove("jumping");game.classList.remove("night");
  startScreen.style.display="none";gameOver.style.display="none";running=true;
  unlockVoice();
  if(animationId) cancelAnimationFrame(animationId);
  animationId=requestAnimationFrame(gameLoop);
}
function jump(){
  if(!running||jumping)return;
  jumping=true;velocity=JUMP_POWER;dino.classList.add("jumping");playVoice();
}
jumpButton.addEventListener("pointerdown",e=>{e.preventDefault();jump()});
document.addEventListener("pointerdown",e=>{
  if(e.target===startButton||e.target===restartButton||e.target===jumpButton)return;
  if(running)jump();
});
document.addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump()}
});
function createObstacle(){
  if(!running)return;
  const type=Math.random()<.75?"cactus":"rock",element=document.createElement("div");
  element.className=type;
  if(type==="cactus")element.style.height=(45+Math.random()*30)+"px";
  const x=game.clientWidth+30;element.style.left=x+"px";game.appendChild(element);
  obstacles.push({element,x,passed:false});
}
function gameLoop(time){
  if(!running)return;
  if(!lastTime)lastTime=time;
  const delta=Math.min((time-lastTime)/16.67,2);lastTime=time;
  if(jumping){
    dinoBottom+=velocity*delta;velocity-=GRAVITY*delta;
    if(dinoBottom<=GROUND){dinoBottom=GROUND;velocity=0;jumping=false;dino.classList.remove("jumping")}
    dino.style.bottom=dinoBottom+"px";
  }
  obstacleTimer+=delta*16.67;
  if(obstacleTimer>=nextObstacle){createObstacle();obstacleTimer=0;nextObstacle=1500+Math.random()*900}
  obstacles.forEach(o=>{
    o.x-=Math.min(7,4+score*.08)*delta;o.element.style.left=o.x+"px";
    if(!o.passed&&o.x<game.clientWidth*.12){o.passed=true;score++;scoreText.textContent="Score: "+score}
  });
  obstacles=obstacles.filter(o=>{if(o.x<-100){o.element.remove();return false}return true});
  nightTimer+=delta*16.67;if(nightTimer>20000){game.classList.toggle("night");nightTimer=0}
  if(checkCollision()){endGame();return}
  animationId=requestAnimationFrame(gameLoop);
}
function checkCollision(){
  const d=dino.getBoundingClientRect(),padding=10;
  for(const o of obstacles){const r=o.element.getBoundingClientRect();
    if(d.right-padding>r.left&&d.left+padding<r.right&&d.bottom-padding>r.top&&d.top+padding<r.bottom)return true;
  }return false;
}
function endGame(){
  running=false;
  gameOverVoice.pause();
  gameOverVoice.currentTime=0;
  gameOverVoice.play().catch(()=>{});
  if(score>highScore){highScore=score;localStorage.setItem("dinoHighScore",highScore)}
  finalScore.textContent="Score: "+score;highScoreText.textContent="Best: "+highScore;
  flash.style.opacity=".7";setTimeout(()=>flash.style.opacity="0",120);gameOver.style.display="flex";
}
startButton.addEventListener("click",startGame);restartButton.addEventListener("click",startGame);
dino.style.bottom=GROUND+"px";
